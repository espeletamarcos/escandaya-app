# Only for the `alembic` command, to write a new migration after changing the models
# in src/backend/db.py:
#
#   cd backend && uv run alembic revision --autogenerate -m "short description"
#
# It compares the models with the database at DATABASE_PATH (default backend/data/),
# so bring that database up to date first (start the app once). Read the generated
# file before committing it. The app runs the migrations itself at startup.

[alembic]
script_location = %(here)s/src/backend/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
