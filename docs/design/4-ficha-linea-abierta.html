<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Cinta: ficha con una línea abierta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400..800&amp;family=Sofia+Sans+Condensed:wght@600..800&amp;display=swap">
<style>
body{margin:0}
a{color:#1D4EB8}a:hover{color:#16191D}
::selection{background:#A9E07F;color:#16191D}
.b-root{font-family:'Sofia Sans',sans-serif;color:#16191D;font-variant-numeric:tabular-nums lining-nums}
.b-cond{font-family:'Sofia Sans Condensed',sans-serif}
.b-tape{display:inline-block;background:#A9E07F;padding:8px 18px 6px;font-family:'Sofia Sans Condensed',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:0.02em;color:#16191D;transform:rotate(-1.5deg);transform-origin:left center;box-shadow:0 1px 1px rgba(22,25,29,0.12),0 3px 8px rgba(22,25,29,0.10);clip-path:polygon(0 6%,3% 0,6% 7%,94% 3%,97% 0,100% 8%,99% 50%,100% 92%,96% 100%,92% 94%,8% 98%,4% 92%,0 100%,1% 50%)}
.b-row{width:100%;display:grid;grid-template-columns:minmax(0,1fr) 68px 72px;column-gap:12px;align-items:baseline;min-height:52px;padding:14px 16px;background:none;border:0;border-top:1px solid #E1E5E8;text-align:left;font:inherit;color:inherit;cursor:pointer}
.b-row:focus-visible{outline:2px solid #1D4EB8;outline-offset:-2px}
.b-field{display:flex;flex-direction:column;gap:4px}
.b-flab{font-family:'Sofia Sans Condensed',sans-serif;font-size:13px;font-weight:700;color:#4D555C}
.b-input{box-sizing:border-box;width:100%;min-height:48px;padding:0 12px;background:#FFFFFF;border:1px solid #B9C2C7;border-radius:8px;font:inherit;font-size:17px;color:#16191D}
.b-input:focus{outline:2px solid #4C9A2A;outline-offset:1px;border-color:#4C9A2A}
.b-num{text-align:right;font-size:16px}
.b-est{color:#1D4EB8}
.b-falta{display:inline-block;background:#F6DAD6;color:#9E231C;font-family:'Sofia Sans Condensed',sans-serif;font-weight:800;font-size:13px;letter-spacing:0.04em;padding:2px 8px}
</style>
</head><body>
<div class="b-root" style="position: relative; width: 390px; height: 1460px; overflow: hidden; background: #EDF0F1; display: flex; flex-direction: column;">

  <header style="padding: 24px 20px 0; display: flex; flex-direction: column; gap: 14px;">
    <h1 style="margin: 0;"><span class="b-tape" style="font-size: 30px; line-height: 1.1;">Tartar de atún</span></h1>
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <p style="margin: 0; font-size: 17px; font-weight: 600;">2 kg · <span class="b-est">≈ 40 raciones</span> · <span style="font-weight: 400; color: #4D555C;">sin confirmar</span></p>
      <span class="b-cond" style="font-weight: 800; font-size: 15px; color: #C42F27; letter-spacing: 0.04em;">14 NOV</span>
    </div>
  </header>

  <section aria-label="Coste" style="padding: 24px 20px 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;">
    <div style="display: flex; flex-direction: column;">
      <span style="font-size: 54px; line-height: 1; font-weight: 800; letter-spacing: -0.03em;">1,60 €</span>
      <span style="font-size: 15px; color: #4D555C; margin-top: 4px;">por ración</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 14px; color: #4D555C;">
      <span>Total <strong style="color: #16191D;">64,05 €</strong></span>
      <span class="b-est" style="font-weight: 700;">2 % estimado</span>
    </div>
  </section>

  <section aria-labelledby="b-ing" style="margin: 24px 12px 0; background: #FFFFFF; border-radius: 10px; box-shadow: 0 1px 2px rgba(22,25,29,0.06), 0 4px 12px rgba(22,25,29,0.05);">
    <div style="display: grid; grid-template-columns: minmax(0,1fr) 68px 72px; column-gap: 12px; padding: 14px 16px 10px;">
      <h2 id="b-ing" class="b-cond" style="margin: 0; font-size: 15px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase;">Ingredientes</h2>
      <span class="b-cond" style="text-align: right; font-size: 13px; font-weight: 700; color: #4D555C;">Cantidad</span>
      <span class="b-cond" style="text-align: right; font-size: 13px; font-weight: 700; color: #4D555C;">Importe</span>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0;">
      <li><button type="button" class="b-row"><span style="font-size: 16px;">Atún rojo, lomo</span><span class="b-num">1,6 kg</span><span class="b-num">60,80 €</span></button></li>
      <li><button type="button" class="b-row"><span style="font-size: 16px;">Chalota</span><span class="b-num">120 g</span><span class="b-num">0,38 €</span></button></li>
      <li><button type="button" class="b-row"><span style="font-size: 16px;">Alcaparras</span><span class="b-num">40 g</span><span class="b-num">0,56 €</span></button></li>
      <li><button type="button" class="b-row"><span style="font-size: 16px;">Salsa de soja</span><span class="b-num">60 ml</span><span class="b-num">0,36 €</span></button></li>
      <li><button type="button" class="b-row"><span style="font-size: 16px;">Aceite de oliva virgen extra</span><span class="b-num">80 ml</span><span class="b-num">0,72 €</span></button></li>
      <li style="border-top: 1px solid #E1E5E8; background: #F3F9EC;">
        <button type="button" class="b-row" aria-expanded="true" style="border-top: 0;"><span style="font-size: 16px; font-weight: 800;">Lima</span><span class="b-num b-est">≈ 3 ud</span><span class="b-num b-est">≈ 1,05 €</span></button>
        <div style="padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px;">
          <label class="b-field"><span class="b-flab">Nombre</span><input class="b-input" type="text" value="Lima"></label>
          <div style="display: grid; grid-template-columns: minmax(0, 1fr) 112px; gap: 12px;">
            <label class="b-field"><span class="b-flab">Cantidad</span><input class="b-input" type="text" inputmode="decimal" value="3"></label>
            <label class="b-field"><span class="b-flab">Unidad</span><select class="b-input"><option>g</option><option>kg</option><option>ml</option><option>l</option><option selected>ud</option></select></label>
          </div>
          <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; font-size: 16px; font-weight: 600;"><input type="checkbox" checked style="width: 24px; height: 24px; accent-color: #1D4EB8; margin: 0;"> Estimado <span class="b-est" style="font-weight: 700;">≈</span></label>
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
            <button type="button" style="min-height: 48px; padding: 0 8px; background: none; border: 0; font: inherit; font-size: 16px; font-weight: 700; color: #B8261E; cursor: pointer;">Eliminar</button>
            <button type="button" style="min-height: 48px; min-width: 120px; padding: 0 20px; background: #A9E07F; border: 0; border-radius: 10px; font: inherit; font-size: 16px; font-weight: 800; color: #13240F; cursor: pointer;">Listo</button>
          </div>
        </div>
      </li>
      <li><button type="button" class="b-row"><span style="font-size: 16px;">Sésamo tostado</span><span class="b-num b-est">≈ 15 g</span><span class="b-num b-est">≈ 0,18 €</span></button></li>
      <li><button type="button" class="b-row"><span style="font-size: 16px;">Cebollino</span><span style="text-align: right;"><span class="b-falta">FALTA</span></span><span class="b-num" style="color: #4D555C;">—</span></button></li>
    </ul>
    <button type="button" style="width: 100%; min-height: 52px; background: none; border: 0; border-top: 1px solid #E1E5E8; font: inherit; font-size: 16px; font-weight: 700; color: #2D6A27; display: flex; align-items: center; gap: 8px; padding: 0 16px; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Añadir ingrediente
    </button>
  </section>

  <p style="margin: 12px 20px 0; font-size: 14px; color: #4D555C;"><span class="b-est" style="font-weight: 700;">≈ en azul</span>: estimado. Toca una línea para corregirla.</p>

  <div style="padding: 24px 20px 0;">
    <button type="button" style="width: 100%; min-height: 56px; background: #A9E07F; border: 0; border-radius: 10px; font: inherit; font-size: 17px; font-weight: 800; color: #13240F; cursor: pointer;">Confirmar ficha</button>
  </div>

  <nav aria-label="Secciones" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 1px solid #D5DADD; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));">
    <button type="button" aria-current="page" style="background: transparent; border: 0; font: inherit; font-size: 13px; font-weight: 800; color: #16191D; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 10px; gap: 4px; cursor: pointer;">
      <span style="background: #A9E07F; border-radius: 14px; padding: 2px 16px; display: flex;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg></span>
      Nueva ficha
    </button>
    <button type="button" style="background: transparent; border: 0; font: inherit; font-size: 13px; font-weight: 600; color: #4D555C; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 10px; gap: 4px; cursor: pointer;">
      <span style="padding: 2px 16px; display: flex;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"></path><path d="M4 6h1M4 12h1M4 18h1"></path></svg></span>
      Preparaciones
    </button>
  </nav>
</div>
</body></html>
