<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Cinta: preparaciones</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400..800&amp;family=Sofia+Sans+Condensed:wght@600..800&amp;display=swap">
<style>
body{margin:0}
a{color:#1D4EB8}a:hover{color:#16191D}
.b-root{font-family:'Sofia Sans',sans-serif;color:#16191D;font-variant-numeric:tabular-nums lining-nums}
.b-cond{font-family:'Sofia Sans Condensed',sans-serif}
.b-tape{display:inline;font-family:'Sofia Sans',sans-serif;font-weight:800;letter-spacing:-0.01em;color:#4C9A2A;font-size:20px;line-height:1.2}
.b-label{display:inline-block;background:#A9E07F;padding:8px 18px 6px;font-family:'Sofia Sans Condensed',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:0.02em;color:#16191D;transform:rotate(-1.5deg);transform-origin:left center;box-shadow:0 1px 1px rgba(22,25,29,0.12),0 3px 8px rgba(22,25,29,0.10);clip-path:polygon(0 6%,3% 0,6% 7%,94% 3%,97% 0,100% 8%,99% 50%,100% 92%,96% 100%,92% 94%,8% 98%,4% 92%,0 100%,1% 50%)}
.b-item{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;row-gap:6px;align-items:center;min-height:76px;padding:14px 16px;background:none;border:0;border-top:1px solid #E1E5E8;text-align:left;font:inherit;color:inherit;cursor:pointer}
.b-item:focus-visible{outline:2px solid #1D4EB8;outline-offset:-2px}
.b-meta{font-size:14px;color:#4D555C}
.b-cost{font-size:22px;font-weight:800;text-align:right;letter-spacing:-0.01em;line-height:1}
.b-per{font-size:13px;color:#4D555C;text-align:right}
.b-est{color:#1D4EB8}
.b-falta{color:#C42F27;font-weight:700}
</style>
</head><body>
<div class="b-root" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #EDF0F1; display: flex; flex-direction: column;">

  <header style="padding: 24px 20px 16px; display: flex; justify-content: space-between; align-items: baseline;">
    <h1 style="margin: 0;"><span class="b-label" style="font-size: 30px; line-height: 1.1;">Preparaciones</span></h1>
    <span style="font-size: 14px; font-weight: 600; color: #4D555C;">5 fichas</span>
  </header>

  <section aria-label="Preparaciones guardadas" style="margin: 0 12px; background: #FFFFFF; border-radius: 10px; box-shadow: 0 1px 2px rgba(22,25,29,0.06), 0 4px 12px rgba(22,25,29,0.05); overflow: hidden;">
    <ul style="list-style: none; margin: 0; padding: 0;">
      <li><button type="button" class="b-item" style="border-top: 0;">
        <span class="b-tape">Tartar de atún</span>
        <span class="b-cost">1,60 €</span>
        <span class="b-meta"><span class="b-est">≈ 40 raciones</span> · 14 nov · <span class="b-falta">1 falta</span></span>
        <span class="b-per">por ración</span>
      </button></li>
      <li><button type="button" class="b-item">
        <span class="b-tape">Caldo de galeras</span>
        <span class="b-cost">0,42 €</span>
        <span class="b-meta">60 raciones · 12 nov</span>
        <span class="b-per">por ración</span>
      </button></li>
      <li><button type="button" class="b-item">
        <span class="b-tape">Pichón en dos cocciones</span>
        <span class="b-cost">6,90 €</span>
        <span class="b-meta">24 raciones · 12 nov</span>
        <span class="b-per">por ración</span>
      </button></li>
      <li><button type="button" class="b-item">
        <span class="b-tape">Helado de aceite de oliva</span>
        <span class="b-cost b-est">≈ 0,55 €</span>
        <span class="b-meta">50 raciones · 10 nov · <span class="b-falta">2 faltan</span></span>
        <span class="b-per">por ración</span>
      </button></li>
      <li><button type="button" class="b-item">
        <span class="b-tape">Pan de masa madre</span>
        <span class="b-cost">0,18 €</span>
        <span class="b-meta">80 raciones · 9 nov</span>
        <span class="b-per">por ración</span>
      </button></li>
    </ul>
  </section>

  <nav aria-label="Secciones" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 1px solid #D5DADD; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));">
    <button type="button" style="background: transparent; border: 0; font: inherit; font-size: 13px; font-weight: 600; color: #4D555C; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 10px; gap: 4px; cursor: pointer;">
      <span style="padding: 2px 16px; display: flex;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg></span>
      Nueva ficha
    </button>
    <button type="button" aria-current="page" style="background: transparent; border: 0; font: inherit; font-size: 13px; font-weight: 800; color: #16191D; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 10px; gap: 4px; cursor: pointer;">
      <span style="background: #A9E07F; border-radius: 14px; padding: 2px 16px; display: flex;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"></path><path d="M4 6h1M4 12h1M4 18h1"></path></svg></span>
      Preparaciones
    </button>
  </nav>
</div>
</body></html>
